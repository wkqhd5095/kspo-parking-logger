name: collect-parking

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect-parking
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: parking-data
          path: store
      - name: 주차현황 1회 수집
        env:
          PARKING_API_KEY: ${{ secrets.PARKING_API_KEY }}
          OUT_DIR: store/data/parking
        run: python3 code/scripts/collect_parking.py
      - name: 데이터 브랜치에 커밋
        working-directory: store
        run: |
          git config user.name  "parking-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parking
          git diff --cached --quiet && exit 0
          git commit -q -m "parking: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; done
          exit 1
